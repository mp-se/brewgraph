server {
  listen 80;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Scripts (including generated env-config.js) are served as external same-origin files.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:;" always;

  root /usr/share/nginx/html;

  # ── Device ingestion endpoints ──────────────────────────────────────────────
  # Devices post to the short URL /ingest/<device>; the API only serves
  # /api/ingest/<device>, so the URI is rewritten before proxying. proxy_pass
  # has no URI part so the rewritten path is what gets forwarded.

  location /ingest/ {
    rewrite            ^/ingest/(.*)$ /api/ingest/$1 break;
    proxy_pass         http://${API_HOST};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }

  # ── Internal API ─────────────────────────────────────────────────────────────

  location /health {
    proxy_pass http://${API_HOST}/health;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
  }

  location /api/devices {
    proxy_pass http://${API_HOST}/api/devices;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }

  location /api/batches {
    proxy_pass http://${API_HOST}/api/batches;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }

  location /api/system {
    proxy_pass http://${API_HOST}/api/system;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }

  # SSE event stream — mounted outside /api per docs/spec-api.md.
  # Buffering MUST stay off or events sit in the proxy buffer instead of
  # reaching the browser.
  location /events {
    proxy_pass http://${API_HOST}/events;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_http_version 1.1;      # HTTP/1.1 for chunked transfer encoding
    proxy_buffering off;         # Stream events immediately
    proxy_cache off;             # Never cache an SSE response
    proxy_read_timeout 86400s;   # Streams are long-lived
    proxy_set_header Connection "";  # Clear default "close" to allow keepalive
  }

  location /api/taps {
    proxy_pass http://${API_HOST}/api/taps;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }

  location /api/vessels {
    proxy_pass http://${API_HOST}/api/vessels;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }

  # Catch-all for other /api routes not matched above (e.g., /api/dashboard)
  location /api {
    proxy_pass http://${API_HOST}/api;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }

  # Anonymous public display: static app via its dedicated container, while
  # the three public documents retain the same origin and reach the OSS API.
  location = /public {
    return 308 /public/$is_args$args;
  }

  location ^~ /public/ {
    # The trailing slash removes /public/ before forwarding. This lets the
    # display container resolve its own /assets/... files instead of the main
    # web SPA returning index.html for them.
    proxy_pass http://brewgraph-display/;
  }

  location ~ ^/(?:d|t|b)(?:/|$) {
    proxy_pass http://${API_HOST};
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
  }

  # API docs are blocked at the proxy layer — access them directly on the API
  # port (default 8080) during development.
  location /docs { return 404; }
  location /openapi.json { return 404; }

  # ── SPA fallback ─────────────────────────────────────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }
}
