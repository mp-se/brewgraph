server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /logos/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
