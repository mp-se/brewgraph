name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — pylint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements/test-requirements.txt

      - name: Install dependencies
        run: pip install -r requirements/test-requirements.txt

      - name: Lint
        # --fail-under=9.9: covers the one accepted arguments-differ finding in
        # oss/services/batch_dry_hop.py (BatchDryHopService.create_list needs
        # batch_id as context BaseService.create_list has no room for — a
        # genuine, deliberate signature difference, not a bug).
        run: pylint --fail-under=9.9 main_oss.py core oss tests

      - name: Test
        run: pytest tests/

  api-postgres:
    name: API — pytest (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    # SQLite runs the suite without `PRAGMA foreign_keys`, so a dangling FK or a
    # child left behind by a bulk DELETE passes there and fails only against a real
    # database. The purge job deletes across relationships, which makes that gap
    # load-bearing rather than theoretical. PostgreSQL is this app's standard
    # backend, so it is what the second run uses.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brewgraph
          POSTGRES_PASSWORD: brewgraph
          POSTGRES_DB: brewgraph_test
        options: >-
          --health-cmd "pg_isready -U brewgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements/test-requirements.txt

      - name: Install dependencies
        run: pip install -r requirements/test-requirements.txt

      - name: Alembic round-trip
        # pytest builds its schema with `create_all` from the ORM, so it never
        # executes the migration — while a real install has no other path. Running
        # both catches drift between them. Ends on `downgrade base` so pytest starts
        # from an empty database rather than reusing these tables via `checkfirst`.
        env:
          DATABASE_URL: postgresql+psycopg2://brewgraph:brewgraph@localhost:5432/brewgraph_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic downgrade base

      - name: Test
        env:
          DATABASE_URL: postgresql+psycopg2://brewgraph:brewgraph@localhost:5432/brewgraph_test
        run: pytest tests/ --tb=short -q

  web:
    name: Web — eslint + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:unit

      - name: Build
        run: npm run build

  build-push:
    name: Build & push images to Docker Hub
    runs-on: ubuntu-latest
    needs: [api, api-postgres, web]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mpse2
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images (linux/amd64,linux/arm64)
        # Image names match the docker-compose service images (brewgraph-<service>).
        # Web and display receive GIT_HASH, baked into their Vite bundles.
        # A `vX.Y.Z` tag push adds a matching version tag on every image
        # alongside the usual sha/latest pair; a plain push to main gets only
        # sha/latest.
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          VERSION_TAG=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          fi

          for image in api ble log mdns; do
            TAG_ARGS=(-t "mpse2/brewgraph-${image}:${GIT_HASH}" -t "mpse2/brewgraph-${image}:latest")
            [ -n "$VERSION_TAG" ] && TAG_ARGS+=(-t "mpse2/brewgraph-${image}:${VERSION_TAG}")
            docker buildx build --platform linux/amd64,linux/arm64 \
              "${TAG_ARGS[@]}" \
              -f "$image"/Dockerfile --push "$image"
          done

          # Context is the repo root, not web/: the bundle imports
          # api/oss/*.schema.json and rollup resolves it at build time.
          WEB_TAG_ARGS=(-t "mpse2/brewgraph-web:${GIT_HASH}" -t "mpse2/brewgraph-web:latest")
          [ -n "$VERSION_TAG" ] && WEB_TAG_ARGS+=(-t "mpse2/brewgraph-web:${VERSION_TAG}")
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg GIT_HASH="$GIT_HASH" \
            "${WEB_TAG_ARGS[@]}" \
            -f web/Dockerfile --push .

          # Like web, display builds from the repository root because its
          # Dockerfile copies the display/ directory explicitly.
          DISPLAY_TAG_ARGS=(-t "mpse2/brewgraph-display:${GIT_HASH}" -t "mpse2/brewgraph-display:latest")
          [ -n "$VERSION_TAG" ] && DISPLAY_TAG_ARGS+=(-t "mpse2/brewgraph-display:${VERSION_TAG}")
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg GIT_HASH="$GIT_HASH" \
            "${DISPLAY_TAG_ARGS[@]}" \
            -f display/Dockerfile --push .
