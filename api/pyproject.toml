[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brewgraph"
version = "2.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "redis>=5.0",
    "starlette>=0.41",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.26",
    "httpx>=0.27",
    "requests>=2.32",
    "pylint>=4.0",
    # Validates producers against api/oss/export-v1.schema.json, the shared
    # definition of the export format. Test-only: nothing at runtime validates.
    "jsonschema>=4.20",
]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["core"]
omit = ["tests/*", "core/ml/fermentation_completion_predictor.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

